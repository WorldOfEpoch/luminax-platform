# Canonical public stack. Every service requires an explicit profile.
name: luminax-public
services:
  config-init:
    image: alpine:3.21
    profiles:
    - core
    restart: 'no'
    command:
    - sh
    - /seed-config.sh
    volumes:
    - ./config:/seed:ro
    - runtime_config:/target
    - ./tools/seed_config.sh:/seed-config.sh:ro
  redis:
    image: redis:7-alpine
    restart: 'no'
    volumes:
    - redis_data:/data
    profiles:
    - core
    environment: {}
  qdrant:
    image: qdrant/qdrant:latest
    restart: 'no'
    volumes:
    - qdrant_data:/qdrant/storage
    profiles:
    - core
    environment: {}
  mysql:
    image: mysql:8.4
    restart: 'no'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate private database credentials}
      MYSQL_DATABASE: luminax
      MYSQL_USER: luminax
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Generate private database credentials}
    volumes:
    - mysql_data:/var/lib/mysql
    - ./mysql-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    profiles:
    - core
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - --silent
      interval: 5s
      timeout: 3s
      retries: 30
  assistant-core:
    build: ./assistant-core
    env_file:
    - .env
    restart: 'no'
    volumes:
    - ./:/workspace/luminax:ro
    - runtime_config:/workspace/luminax/config
    - memory_data:/data/memory
    - memory_data:/workspace/luminax/memory
    - projects_data:/data/projects
    - projects_data:/workspace/luminax/projects
    - games_data:/data/games
    - logs_data:/data/logs
    - logs_data:/workspace/luminax/logs
    - generated_media:/workspace/luminax/generated_media
    - upgrades_data:/workspace/luminax/upgrades
    - published_sites:/workspace/luminax/published_sites
    - sites_data:/workspace/luminax/sites
    - reports_data:/workspace/luminax/reports
    - models_data:/data/models
    - runtime_data:/data/runtime
    profiles:
    - core
    depends_on:
      config-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      CONTROL_TOKEN: ${CONTROL_TOKEN:?Run tools/initialize_local_config.py first}
    extra_hosts:
    - host.docker.internal:host-gateway
  zeus-discord:
    build: ./discord-bot
    env_file:
    - .env
    restart: 'no'
    environment:
      DISCORD_TOKEN: ${ZEUS_DISCORD_TOKEN}
      MAIN_CONNECTOR_NAME: ${ZEUS_DISCORD_MAIN_CONNECTOR_NAME:-Zeus}
      DISCORD_CONNECTOR_NAME: ${ZEUS_DISCORD_CONNECTOR_NAME:-Zeus}
      DISCORD_PERSONA_MODE: zeus
      DISCORD_SERVICE_LABEL_KEY: zeus-discord
      DISCORD_LEADER_LEASE_KEY: discord:zeus:leader
      CONTROL_TOKEN: ${CONTROL_TOKEN:?Run tools/initialize_local_config.py first}
    volumes:
    - ./:/workspace/luminax:ro
    - runtime_config:/workspace/luminax/config
    - memory_data:/data/memory
    - memory_data:/workspace/luminax/memory
    - projects_data:/data/projects
    - projects_data:/workspace/luminax/projects
    - games_data:/data/games
    - logs_data:/data/logs
    - logs_data:/workspace/luminax/logs
    - generated_media:/workspace/luminax/generated_media
    - upgrades_data:/workspace/luminax/upgrades
    - published_sites:/workspace/luminax/published_sites
