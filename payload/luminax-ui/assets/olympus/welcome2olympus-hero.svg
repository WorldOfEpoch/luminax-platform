<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">welcome2olympus hero</title>
  <desc id="desc">Stylized Olympus skyline with a radiant summit, electric cloud rings, and a command-grid foreground.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07121f"/>
      <stop offset="55%" stop-color="#10233a"/>
      <stop offset="100%" stop-color="#1d1233"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="45%" stop-color="#ffe18a"/>
      <stop offset="100%" stop-color="#f6a44d"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#09101b"/>
      <stop offset="50%" stop-color="#102845"/>
      <stop offset="100%" stop-color="#140f26"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <circle cx="960" cy="170" r="100" fill="url(#sun)" filter="url(#glow)" opacity="0.95"/>
  <g opacity="0.38" stroke="#8aefff" fill="none">
    <ellipse cx="960" cy="170" rx="180" ry="58"/>
    <ellipse cx="960" cy="170" rx="240" ry="82"/>
    <ellipse cx="960" cy="170" rx="300" ry="102"/>
  </g>
  <path d="M0 618 L160 560 L275 592 L420 470 L560 580 L720 342 L835 450 L980 258 L1128 432 L1268 366 L1440 470 L1440 900 L0 900 Z" fill="url(#ridge)"/>
  <path d="M0 664 L160 610 L295 644 L434 548 L545 626 L718 420 L850 520 L986 336 L1106 506 L1248 452 L1440 544" fill="none" stroke="#74e7ff" stroke-width="4" opacity="0.45"/>
  <g opacity="0.16" stroke="#78f4ff">
    <path d="M0 700 H1440"/>
    <path d="M0 744 H1440"/>
    <path d="M0 788 H1440"/>
    <path d="M0 832 H1440"/>
    <path d="M180 630 V900"/>
    <path d="M360 610 V900"/>
    <path d="M540 540 V900"/>
    <path d="M720 390 V900"/>
    <path d="M900 470 V900"/>
    <path d="M1080 410 V900"/>
    <path d="M1260 450 V900"/>
  </g>
  <g transform="translate(118 108)">
    <text x="0" y="0" fill="#fff3cf" font-family="Georgia, serif" font-size="34" letter-spacing="8">WELCOME2OLYMPUS</text>
    <text x="0" y="60" fill="#d8f8ff" font-family="Arial, sans-serif" font-size="72" font-weight="700">Mount Olympus</text>
    <text x="0" y="110" fill="#8cecff" font-family="Arial, sans-serif" font-size="24">Zeus commands Hermes, Darius, Athena Ops, and the worker pantheon.</text>
  </g>
</svg>
