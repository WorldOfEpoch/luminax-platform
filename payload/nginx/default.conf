# Optional upstreams resolve at request time; their absence does not break the core UI.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    include /etc/nginx/luminax/listen.conf;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 250M;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    include /etc/nginx/luminax/auth-basic.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_http_version 1.1;
    proxy_set_header X-Web-Auth-User $remote_user;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
    set $assistant_core http://assistant-core:8000;
    location / { try_files $uri /index.html; }
    location /api/ { proxy_pass $assistant_core; }
    location /sites/ {
        rewrite ^/sites/(.*)$ /api/sites/public/$1 break;
        proxy_pass $assistant_core;
    }
    location /default-site/ {
        rewrite ^/default-site/?(.*)$ /api/sites/default/public/$1 break;
        proxy_pass $assistant_core;
    }
    location /browser/ {
        set $upstream_0 http://browser-agent:8010;
        rewrite ^/browser/(.*)$ /$1 break;
        proxy_pass $upstream_0;
    }
    location /vision/ {
        set $upstream_1 http://vision-agent:8020;
        rewrite ^/vision/(.*)$ /$1 break;
        proxy_pass $upstream_1;
    }
    location /voice/ {
        set $upstream_2 http://voice-agent:8030;
        rewrite ^/voice/(.*)$ /$1 break;
        proxy_pass $upstream_2;
    }
    location /admin/ {
        set $upstream_3 http://admin-api:8040;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass $upstream_3;
    }
    location /realtime/ {
        set $upstream_4 http://realtime-gateway:8050;
        rewrite ^/realtime/(.*)$ /$1 break;
        proxy_pass $upstream_4;
    }
    location /research/ {
        set $upstream_5 http://research-worker:8060;
        rewrite ^/research/(.*)$ /$1 break;
        proxy_pass $upstream_5;
    }
    location /sitesvc/ {
        set $upstream_6 http://site-manager:8070;
        rewrite ^/sitesvc/(.*)$ /$1 break;
        proxy_pass $upstream_6;
    }
    location /accounts/ {
        set $upstream_7 http://account-worker:8085;
        rewrite ^/accounts/(.*)$ /$1 break;
        proxy_pass $upstream_7;
    }
    location /network/ {
        set $upstream_8 http://network-manager:8090;
        rewrite ^/network/(.*)$ /$1 break;
        proxy_pass $upstream_8;
    }
    location /hive/dreamer/ {
        set $upstream_9 http://lumi-hive-dreamer:8101;
        rewrite ^/hive/dreamer/(.*)$ /$1 break;
        proxy_pass $upstream_9;
    }
    location /hive/engineer/ {
        set $upstream_10 http://lumi-hive-engineer:8102;
        rewrite ^/hive/engineer/(.*)$ /$1 break;
        proxy_pass $upstream_10;
    }
    location /hive/critic/ {
        set $upstream_11 http://lumi-hive-critic:8103;
        rewrite ^/hive/critic/(.*)$ /$1 break;
        proxy_pass $upstream_11;
    }
    location /three/ {
        set $upstream_12 http://lumi-3d-engineer:8110;
        rewrite ^/three/(.*)$ /$1 break;
        proxy_pass $upstream_12;
    }
    location /finance/ {
        set $upstream_13 http://lumi-finance-swarm:8120;
        rewrite ^/finance/(.*)$ /$1 break;
        proxy_pass $upstream_13;
    }
    location /underfoot/voice/ {
        set $upstream_14 http://underfoot-voice-gateway:8470;
        rewrite ^/underfoot/voice/(.*)$ /$1 break;
        proxy_pass $upstream_14;
    }
    location /underfoot/world/ {
        set $upstream_15 http://underfoot-world:8460;
        rewrite ^/underfoot/world/(.*)$ /$1 break;
        proxy_pass $upstream_15;
    }
}
