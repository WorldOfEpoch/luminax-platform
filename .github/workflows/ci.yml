name: Offline source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/audit-publication.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r payload/olympus-edge-bridge/requirements.txt
      - run: python -m compileall -q payload tools
      - run: python -m unittest discover -s payload/olympus-edge-bridge -p "test_*.py" -v
      - run: python -m unittest discover -s payload/assistant-core/tests -p "test_*.py" -v
      - run: python -B -m unittest discover -s payload/service-runtime -p "test_*.py" -v
      - run: python -B -m unittest discover -s payload/tools/tests -p "test_*.py" -v
      - run: python -B -m unittest discover -s tools/tests -p "test_*.py" -v
      - run: python payload/tools/check_public_config.py
      - if: runner.os == 'Linux'
        run: python payload/tools/check_public_config.py --compose
      - run: node --test tests/web-publication.test.mjs
      - run: npm ci --prefix sites/papr-src --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix sites/papr-src
      - if: runner.os == 'Linux'
        run: python -c "import json,subprocess; [subprocess.run(['bash','-n',p],check=True) for p in json.load(open('PUBLICATION_FILES.json')) if p.endswith('.sh')]"
      - if: runner.os == 'Linux'
        run: bash luminax.sh --profile core
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/tests/Test-PublicWindowsTools.ps1
      - if: runner.os == 'Windows'
        run: dotnet restore desktop-shell/Luminax.DesktopShell.csproj
      - if: runner.os == 'Windows'
        run: dotnet build desktop-shell/Luminax.DesktopShell.csproj --no-restore -c Release
